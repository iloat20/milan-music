name: CI

# 这个仓库原来的门禁全靠手工：282 例单测、lintRelease、apksigner / zipalign / badging
# 与 SHA-256 都在本机终端里跑。严谨度不缺，缺的是**不可跳过性** —— 某天漏跑一次，
# 回归就静默入库了。这里把它变成 push 的硬前置。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # AGP 9.4.1 要求 JDK 17。不用 runner 默认的 java：版本随镜像漂移，
  # 而 Kotlin 2.4 / AGP 9 对 JDK 版本是硬要求。
  JAVA_VERSION: "17"
  BUILD_TOOLS: "37.0.0"

jobs:
  gate:
    name: 门禁（单测 + lint + 零警告）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 不用 android-actions/setup-android：本仓库第一次 CI 就死在它这一步，构建任务
      # 一个都没跑到。注解给的原因是该 action 仍以 Node 20 为目标、被强制跑在 Node 24 上，
      # 叠加 ubuntu-latest 自 2026-10-19 起迁往 Ubuntu 26。runner 镜像本身自带 Android
      # SDK（ANDROID_SDK_ROOT 已导出），我们只需要补 platform 与 build-tools。
      #
      # 这一步刻意做成"探针 + 尽力安装"：装不上也不算失败，构建侧还有
      # -Pandroid.builder.sdkDownload=true 兜底，由 AGP 自己下。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDK=$SDK"
          ls "$SDK" 2>/dev/null || echo "镜像里没有 SDK 目录"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager || true)"
          echo "sdkmanager=$SDKMGR"
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::warning::找不到 sdkmanager，交给 AGP 的 android.builder.sdkDownload 自补"
            exit 0
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          # compileSdk 37 的 platform 目录名是 android-37.0，与包名不一定同名，两个都试。
          for pkg in "platforms;android-37" "platforms;android-37.0" "build-tools;${BUILD_TOOLS}"; do
            "$SDKMGR" "$pkg" || echo "::warning::$pkg 未装上，交给 AGP 自补"
          done

      - uses: gradle/actions/setup-gradle@v4

      - name: 单测与 lint
        # --rerun-tasks 是刻意的：任务命中构建缓存时会显示 UP-TO-DATE 而根本不执行，
        # 改过测试也照样"绿"。门禁要的是执行过的结果，不是缓存里旧的结果。
        run: |
          set -o pipefail
          set +e
          ./gradlew :app:testDebugUnitTest :app:lintRelease \
            --rerun-tasks --console=plain --stacktrace \
            -Pandroid.builder.sdkDownload=true 2>&1 | tee gradle.log
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # 作业日志的下载接口要凭据，而注解是公开可读的：把真实报错逐行写成注解，
            # 否则只能看到一个红色的步骤名。tail 取尾部，报错的 cause 链都在那儿。
            tail -40 gradle.log | sed 's/^/::error::/'
            exit "$status"
          fi

      - name: 断言零 Kotlin 警告
        run: |
          # 唯一允许的 warning 是 uses-permission#INTERNET（隐私护栏，见 README）。
          # 它来自 manifest 合并，不出现在 Kotlin 的 `w:` 行里。
          if grep -qE '^w: ' gradle.log; then
            echo "::error::Kotlin 编译产生警告，门禁要求零 w:"
            grep -E '^w: ' gradle.log | head -50
            exit 1
          fi
          echo "zero Kotlin warnings"

      - name: 失败时留档
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: |
            gradle.log
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: release 包与产物校验
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gate
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/.keystore/milanmusic-release.keystore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDK=$SDK"
          ls "$SDK" 2>/dev/null || echo "镜像里没有 SDK 目录"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager || true)"
          echo "sdkmanager=$SDKMGR"
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::warning::找不到 sdkmanager，交给 AGP 的 android.builder.sdkDownload 自补"
            exit 0
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          for pkg in "platforms;android-37" "platforms;android-37.0" "build-tools;${BUILD_TOOLS}"; do
            "$SDKMGR" "$pkg" || echo "::warning::$pkg 未装上，交给 AGP 自补"
          done

      - uses: gradle/actions/setup-gradle@v4

      # 签名材料走 secrets，不落仓库。keystore 本身是二进制，用 base64 传输。
      - name: 恢复签名材料
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secrets.KEYSTORE_BASE64，release 包无法签名"
            exit 1
          fi
          mkdir -p "$(dirname "$KEYSTORE_PATH")" "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          # build.gradle.kts 读的是 ~/.android/milanmusic-release.keystore，写这个路径。
          cp "$KEYSTORE_PATH" "$HOME/.android/milanmusic-release.keystore"
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "KEYSTORE_STORE_PASSWORD=$KEYSTORE_STORE_PASSWORD"
            echo "KEYSTORE_KEY_PASSWORD=$KEYSTORE_KEY_PASSWORD"
          } > local.properties

      - name: 出包
        run: ./gradlew :app:assembleRelease --console=plain -Pandroid.builder.sdkDownload=true

      # 每一条都是 release 包的判据，任何一条不成立就说明装错了包。
      - name: 校验产物
        run: |
          set -euo pipefail
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/$BUILD_TOOLS"
          APK="app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "::error::没有产出 $APK"; exit 1; }
          [ -x "$BT/apksigner" ] || {
            echo "::error::找不到 $BT/apksigner，build-tools $BUILD_TOOLS 没装上"
            ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" 2>/dev/null || true
            exit 1
          }

          SIZE=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "size=$SIZE sha256=$SHA"

          # 体积护栏。现值约 2.3 MB；这条线是"明显变大"的告警，不是目标值。
          MAX=3000000
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::APK $SIZE B 超过上限 $MAX B"
            exit 1
          fi

          # v2/v3 必须有；debug 证书说明装成了第二个图标。
          "$BT/apksigner" verify --verbose "$APK" | tee sign.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" sign.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" sign.txt
          if "$BT/apksigner" verify --print-certs "$APK" | grep -q "Android Debug"; then
            echo "::error::APK 用的是 debug 证书"
            exit 1
          fi

          "$BT/zipalign" -c -P 16 -v 4 "$APK" > /dev/null

          "$BT/aapt2" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.milan.music'" badging.txt
          # release 只允许 arm64-v8a。debug 保留四 ABI 供模拟器，不走这里。
          grep -q "native-code: 'arm64-v8a'" badging.txt
          if grep -q "native-code:.*'armeabi-v7a'\|native-code:.*'x86" badging.txt; then
            echo "::error::release 包里混进了非 arm64 的 ABI"
            exit 1
          fi

          {
            echo "### release 产物"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 体积 | $SIZE B |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| 签名 | v2 + v3 |"
            echo "| ABI | arm64-v8a |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
